name: Validate Adapter Versions

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'skill.md'
      - 'adapters/**'
      - 'tools/**'
      - 'templates/ai/MODE_REFERENCE.md'
      - '.ai/SKILL_VERSION.md'
      - '.github/workflows/validate-adapter-versions.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'skill.md'
      - 'adapters/**'
      - 'tools/**'
      - 'templates/ai/MODE_REFERENCE.md'
      - '.ai/SKILL_VERSION.md'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: ./tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      working-directory: ./tools
      run: |
        python -m pytest test_skill_parser.py test_template_engine.py test_validators.py test_utils.py test_adapter_generator.py -v --tb=short

    - name: Run integration tests
      working-directory: ./tools
      run: |
        python -m pytest test_integration.py -v --tb=short

    - name: Validate skill.md syntax
      working-directory: ./tools
      run: |
        python - <<'EOF'
        from skill_parser import SkillParser
        p = SkillParser('../skill.md')
        if not p.validate_syntax():
            print("❌ skill.md failed syntax validation")
            exit(1)
        print(f"✓ skill.md syntax valid (version: {p.extract_version()})")
        EOF

    - name: Regenerate adapters and check for diff
      working-directory: ./tools
      run: |
        python adapter_generator.py \
          --input ../skill.md \
          --templates templates/adapter \
          --output ../adapters
        echo "--- git diff (adapters + MODE_REFERENCE.md) ---"
        cd ..
        git diff --name-only adapters/ templates/ai/MODE_REFERENCE.md
        CHANGED=$(git diff --name-only adapters/ templates/ai/MODE_REFERENCE.md | wc -l)
        if [ "$CHANGED" -gt 0 ]; then
          echo ""
          echo "❌ Adapters or MODE_REFERENCE.md are out of sync with skill.md."
          echo "   Run: python tools/adapter_generator.py"
          echo "   Then commit the regenerated files."
          exit 1
        else
          echo "✓ All adapters and MODE_REFERENCE.md are in sync with skill.md"
        fi

    - name: Validate generated adapters
      working-directory: ./tools
      run: |
        python - <<'EOF'
        from pathlib import Path
        from validators import AdapterValidator, V2FeatureValidator
        import sys
        v = AdapterValidator()
        results = v.validate_directory('../adapters')
        failed = [(f, errs) for f, (ok, errs) in results.items() if not ok]
        if failed:
            print(f"❌ {len(failed)} adapter(s) failed validation:")
            for fname, errs in failed:
                for vname, msgs in errs.items():
                    for m in msgs:
                        print(f"  {fname} / {vname}: {m}")
            sys.exit(1)
        print(f"✓ All {len(results)} adapters passed validation")

        mode_ref = Path('../templates/ai/MODE_REFERENCE.md')
        ok, errs = V2FeatureValidator().validate(mode_ref.read_text(encoding='utf-8'), str(mode_ref))
        if not ok:
            print("❌ MODE_REFERENCE.md failed V2FeatureValidator:")
            for m in errs:
                print(f"  {m}")
            sys.exit(1)
        print("✓ MODE_REFERENCE.md passed V2FeatureValidator")
        EOF

    - name: Check SKILL_VERSION.md exists
      run: |
        if [ -f ".ai/SKILL_VERSION.md" ]; then
          echo "✓ SKILL_VERSION.md exists"
        else
          echo "✗ SKILL_VERSION.md not found"
          exit 1
        fi

  init-smoke-test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Smoke test init.sh (Linux)
      if: runner.os == 'Linux'
      run: |
        for mode in "--micro" "--lite" ""; do
          TMP_DIR=$(mktemp -d)
          ./init.sh -p "$TMP_DIR" -i claude,antigravity $mode
          test -f "$TMP_DIR/.ai/STATUS.md"
          test -f "$TMP_DIR/.ai/NEXT.md"
          test -f "$TMP_DIR/.ai/MODE_REFERENCE.md"
          test -f "$TMP_DIR/CLAUDE.md"
          test -f "$TMP_DIR/.agents/skills/project-orchestrator/SKILL.md"
          rm -rf "$TMP_DIR"
        done

    - name: Smoke test init.ps1 (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        foreach ($modeFlag in @("Micro", "Lite", "Full")) {
          $tmpDir = Join-Path ([System.IO.Path]::GetTempPath()) ("po-smoke-" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null
          if ($modeFlag -eq "Micro") {
            & .\init.ps1 -Path $tmpDir -IDE "claude,antigravity" -Micro
          } elseif ($modeFlag -eq "Lite") {
            & .\init.ps1 -Path $tmpDir -IDE "claude,antigravity" -Lite
          } else {
            & .\init.ps1 -Path $tmpDir -IDE "claude,antigravity"
          }
          if (-not (Test-Path (Join-Path $tmpDir ".ai\STATUS.md"))) { throw "Missing STATUS.md" }
          if (-not (Test-Path (Join-Path $tmpDir ".ai\NEXT.md"))) { throw "Missing NEXT.md" }
          if (-not (Test-Path (Join-Path $tmpDir ".ai\MODE_REFERENCE.md"))) { throw "Missing MODE_REFERENCE.md" }
          if (-not (Test-Path (Join-Path $tmpDir "CLAUDE.md"))) { throw "Missing CLAUDE.md" }
          if (-not (Test-Path (Join-Path $tmpDir ".agents\skills\project-orchestrator\SKILL.md"))) { throw "Missing Antigravity SKILL.md" }
          Remove-Item -Path $tmpDir -Recurse -Force
        }
