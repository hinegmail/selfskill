name: Validate Adapter Versions

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'adapters/**'
      - '.ai/SKILL_VERSION.md'
      - '.github/workflows/validate-adapter-versions.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'adapters/**'
      - '.ai/SKILL_VERSION.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      working-directory: ./tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Validate adapter versions
      working-directory: ./tools
      run: |
        python adapter_generator.py --validate
      continue-on-error: true
    
    - name: Check SKILL_VERSION.md
      run: |
        if [ -f ".ai/SKILL_VERSION.md" ]; then
          echo "✓ SKILL_VERSION.md exists"
        else
          echo "✗ SKILL_VERSION.md not found"
          exit 1
        fi
