# i18n Configuration
# Internationalization settings for the project

version: '1.0.0'

# Supported languages
languages:
  - code: 'zh'
    name: '简体中文'
    region: 'CN'
    default: true
  - code: 'en'
    name: 'English'
    region: 'US'
    default: false
  - code: 'ja'
    name: '日本語'
    region: 'JP'
    default: false

# Translation file paths
paths:
  translations: './i18n/translations'
  templates: './i18n/templates'
  assets: './i18n/assets'

# Locale settings
locale:
  default: 'zh_CN'
  fallback: 'en_US'
  timezone: 'Asia/Shanghai'

# Translation strings (key-value pairs)
strings:
  # Common labels
  app_name: '自主技能平台'
  app_description: '一个基于Agent的自主技能生成和管理平台'
  
  # UI labels
  home: '首页'
  about: '关于'
  settings: '设置'
  help: '帮助'
  
  # Messages
  success: '成功'
  error: '错误'
  warning: '警告'
  info: '信息'

# Features configuration
features:
  enable_translation_caching: true
  cache_duration: 3600
  enable_fallback_language: true
  enable_pluralization: true
